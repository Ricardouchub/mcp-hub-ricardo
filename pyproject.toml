[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hub-ricardo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.1.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth>=2.34.0",
  "google-api-python-client>=2.149.0",
  "PyGithub>=2.5.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
